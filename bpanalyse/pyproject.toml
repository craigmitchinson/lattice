[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bpanalyse"
version = "0.1.0"
description = "Blue Prism release analyser: inventory, dependency graph, metrics and findings from .bprelease files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openpyxl", "pyyaml"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
bpanalyse = "bpanalyse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
